# Local MySQL/Redis/MinIO for development.
# Start: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: live-more-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: live_more
    ports:
      - "3306:3306"
    volumes:
      - live_more_mysql_data:/var/lib/mysql
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    container_name: live-more-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: live-more-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - live_more_minio_data:/data
    restart: unless-stopped

volumes:
  live_more_mysql_data:
  live_more_minio_data:
