# Render Blueprint：MenoCalm / 潮安 — API（Web Service）+ 社区运营静态站
# 文档: https://docs.render.com/infrastructure-as-code
#
# ========== 首次部署 menocalm-api ==========
# 1. MySQL：在 Render Dashboard 新建 MySQL（或任意兼容托管），建库后执行仓库内 SQL：
#    menocalm-api/docs/mysql-core-schema.sql（及你需要的 migration）。
# 2. Redis：新建 Render Key Value，或使用 Upstash 等，得到 redis://… 连接串。
# 3. 对象存储：S3 兼容（阿里云 OSS / AWS S3 / Cloudflare R2 等），记下 endpoint、bucket、密钥。
# 4. 打开本 Web Service → Environment，填写下方 sync: false 的变量（MYSQL_*、REDIS_URL、S3_* 等）。
#    JWT_SECRET 若未在 Blueprint 中生成，请手动设为 ≥32 字符的随机串（勿用仓库示例占位符）。
# 5. 部署成功后，复制该服务的公网 URL（https://…onrender.com），填到静态站 chaoan-community-admin 的
#    VITE_API_BASE（无尾斜杠），再部署静态站。
#
# ========== 已有仅静态站的项目 ==========
# 在 Render 打开 Blueprint / 与本仓库关联的 Blueprint → Sync / Apply，以合并本文件中的 menocalm-api；
# 或手动新建 Web Service，Docker 根目录 menocalm-api、Dockerfile 路径 ./Dockerfile，环境变量同上。

services:
  # Spring Boot API（Docker 多阶段构建 JAR）
  - type: web
    name: menocalm-api
    runtime: docker
    rootDir: menocalm-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      # 可选；不设则沿用 application.yml 默认（已含 chaoan-community-admin.onrender.com 等）
      # - key: CORS_ALLOWED_ORIGINS
      #   sync: false
      # 社区管理接口放行（JWT sub，逗号分隔）
      - key: COMMUNITY_ADMIN_USER_IDS
        sync: false
    buildFilter:
      paths:
        - menocalm-api/**
        - render.yaml

  # 社区运营静态站（Vite/React）
  - type: web
    name: chaoan-community-admin
    runtime: static
    rootDir: menocalm-admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    buildFilter:
      paths:
        - menocalm-admin-web/**
        - render.yaml
