# Render Blueprint：MenoCalm / 潮安 — Redis（Key Value）+ API（Docker）+ 社区运营静态站
# 文档: https://docs.render.com/infrastructure-as-code
#
# ========== Redis（本文件已包含）==========
# 下方 `menocalm-redis` 为 Render Key Value（Redis® 协议）。`ipAllowList: []` 表示仅同区其它 Render 服务可连（推荐）。
# Key Value 可能计费；若你想用免费层，可删除 `menocalm-redis` 段，并在 menocalm-api 上改回手写 REDIS_URL（如 Upstash）。
#
# ========== MySQL（须另建，Render 无托管 MySQL 如 Postgres 那样一键库）==========
# 任选其一：
# A) Render 官方做法：用 Docker 部署 MySQL 为 Private Service + 持久盘，见 https://docs.render.com/deploy-mysql
#    建库后在 menocalm-api 填 MYSQL_URL（jdbc:mysql://内网主机:3306/库名?…）、MYSQL_USER、MYSQL_PASSWORD。
# B) 外部托管：阿里云 RDS、AWS RDS、PlanetScale、Railway、Aiven 等，把公网/SSL JDBC 填进 MYSQL_*。
# 建表：执行 menocalm-api/docs/mysql-core-schema.sql（及所需 migration）。
#
# ========== 其它 ==========
# 对象存储：S3 兼容（OSS / R2 / S3），在 menocalm-api 填 S3_*。
# 静态站 chaoan-community-admin 的 VITE_API_BASE = menocalm-api 的 https://…onrender.com（无尾斜杠）。
#
# 若 API 已用 CLI 建好、未走 Blueprint：在 Dashboard 新建 Key Value 后，把「Internal Redis URL」复制到
# menocalm-api 环境变量 REDIS_URL；或在本仓库关联 Blueprint 后 Sync，使本文件中的 fromService 生效。

services:
  # Redis（供 menocalm-api 通过内网 connectionString 连接）
  - type: keyvalue
    name: menocalm-redis
    region: oregon
    ipAllowList: []

  # Spring Boot API（Docker 多阶段构建 JAR）
  - type: web
    name: menocalm-api
    runtime: docker
    rootDir: menocalm-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          name: menocalm-redis
          type: keyvalue
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      # 可选；不设则沿用 application.yml 默认（已含 chaoan-community-admin.onrender.com 等）
      # - key: CORS_ALLOWED_ORIGINS
      #   sync: false
      # 社区管理接口放行（JWT sub，逗号分隔）
      - key: COMMUNITY_ADMIN_USER_IDS
        sync: false
    buildFilter:
      paths:
        - menocalm-api/**
        - render.yaml

  # 社区运营静态站（Vite/React）
  - type: web
    name: chaoan-community-admin
    runtime: static
    rootDir: menocalm-admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    buildFilter:
      paths:
        - menocalm-admin-web/**
        - render.yaml
