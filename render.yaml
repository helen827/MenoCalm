# Render Blueprint: 社区运营静态站（Vite/React）
# 文档: https://docs.render.com/infrastructure-as-code
#
# 首次在 Render 创建 Blueprint 时，会提示填写 VITE_API_BASE（你的 live-more-api 公网根 URL，勿尾斜杠）
# 并在 live-more-api 的 CORS_ALLOWED_ORIGINS 中加入本静态站的 https://xxx.onrender.com

services:
  - type: web
    name: chaoan-community-admin
    runtime: static
    rootDir: live-more-admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    buildFilter:
      paths:
        - live-more-admin-web/**
        - render.yaml
