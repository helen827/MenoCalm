<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习 - 潮安</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme-glass.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; padding: 0; background: radial-gradient(circle at 20% 12%, #fffaff 0%, #f8f5f8 34%, #f2ecef 100%); overflow: hidden; position: relative; }
        body::before { content: ''; position: absolute; width: 320px; height: 320px; right: -160px; top: -40px; background: radial-gradient(circle, rgba(231,203,216,0.56), rgba(231,203,216,0)); filter: blur(54px); pointer-events: none; z-index: 0; }
        body::after { content: ''; position: absolute; width: 300px; height: 300px; left: -140px; bottom: 10px; background: radial-gradient(circle, rgba(176,216,255,0.64), rgba(176,216,255,0)); filter: blur(48px); pointer-events: none; z-index: 0; }
        .ios-status-bar { height: 54px; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; padding-top: 18px; position: relative; z-index: 12; }
        .content-area { height: calc(100vh - 54px - 76px); overflow-y: auto; padding-bottom: 20px; position: relative; z-index: 2; }
        .practice-card { background: rgba(255,255,255,0.40); border: 1px solid rgba(255,255,255,0.88); border-radius: 28px; overflow: hidden; box-shadow: inset 0 2px 18px rgba(255,255,255,0.54), 0 14px 30px rgba(138,114,125,0.11); backdrop-filter: blur(42px) saturate(165%); -webkit-backdrop-filter: blur(42px) saturate(165%); cursor: pointer; transition: transform 0.2s; }
        .practice-card:hover { transform: translateY(-2px); }
        .scenario-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; background: rgba(255,255,255,0.56); border: 1px solid rgba(255,255,255,0.9); color: #755f6b; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 76px; background: rgba(255,255,255,0.34); backdrop-filter: blur(30px); border-top: 0; display: flex; justify-content: space-around; align-items: center; padding-top: 0; box-shadow: 0 -6px 14px rgba(138,114,125,0.05); }
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8e8e93; font-size: 10px; }
        .tab-item.active { color: #E4B0B1; }
        .tab-item i { font-size: 21px; }

    </style>
</head>
<body class="has-tab">
    <div class="ios-status-bar">
        <span style="font-weight: 600; font-size: 15px;">9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm ml-1"></i>
            <i class="fas fa-battery-full text-sm ml-1"></i>
        </div>
    </div>

    <div class="content-area pb-20">
        <div class="px-6 pt-2">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">呼吸练习</h1>
            <p class="text-gray-500 text-sm mb-3">在需要的时候，给你即时的放松</p>
            <div class="inline-flex items-center gap-2 text-xs px-3 py-1.5 rounded-full mb-6" style="background:#f3ebee;color:#765d67;">
                <i class="fas fa-arrows-left-right"></i>
                <span>左右滑动切换场景和声音</span>
            </div>

            <div class="bg-gradient-to-r from-rose-100 to-purple-100 rounded-2xl p-5 mb-6">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-white flex items-center justify-center">
                        <i class="fas fa-clock text-2xl text-rose-400"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800">你最近记录了睡眠差</h3>
                        <p class="text-sm text-gray-500 mt-1">推荐今晚试试睡前身体扫描</p>
                    </div>
                </div>
            </div>

            <div class="mb-6">
                <h2 class="font-bold text-gray-800 mb-4">按场景选择</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="practice-card">
                        <div class="h-28 flex items-center justify-center" style="background: linear-gradient(135deg, #f4ecef, #e9dde2);">
                            <i class="fas fa-wind text-4xl text-orange-400"></i>
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-gray-800 mb-1">潮热来临时</h3>
                            <p class="text-xs text-gray-400">90秒降温呼吸</p>
                            <div class="mt-2 flex items-center justify-between">
                                <span class="scenario-tag bg-orange-100 text-orange-600">
                                    <i class="fas fa-fire"></i> 潮热
                                </span>
                                <span class="text-xs text-gray-400">90秒</span>
                            </div>
                        </div>
                    </div>
                    <div class="practice-card">
                        <div class="h-28 flex items-center justify-center" style="background: linear-gradient(135deg, #f4ecef, #e9dde2);">
                            <i class="fas fa-moon text-4xl text-purple-400"></i>
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-gray-800 mb-1">夜间醒来后</h3>
                            <p class="text-xs text-gray-400">重新入睡练习</p>
                            <div class="mt-2 flex items-center justify-between">
                                <span class="scenario-tag bg-purple-100 text-purple-600">
                                    <i class="fas fa-moon"></i> 睡眠
                                </span>
                                <span class="text-xs text-gray-400">5分钟</span>
                            </div>
                        </div>
                    </div>
                    <div class="practice-card">
                        <div class="h-28 flex items-center justify-center" style="background: linear-gradient(135deg, #f4ecef, #e9dde2);">
                            <i class="fas fa-star text-4xl text-indigo-400"></i>
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-gray-800 mb-1">睡前放松</h3>
                            <p class="text-xs text-gray-400">身体扫描</p>
                            <div class="mt-2 flex items-center justify-between">
                                <span class="scenario-tag bg-indigo-100 text-indigo-600">
                                    <i class="fas fa-star"></i> 入睡
                                </span>
                                <span class="text-xs text-gray-400">5-8分钟</span>
                            </div>
                        </div>
                    </div>
                    <div class="practice-card">
                        <div class="h-28 flex items-center justify-center" style="background: linear-gradient(135deg, #f4ecef, #e9dde2);">
                            <i class="fas fa-heartbeat text-4xl text-rose-400"></i>
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-gray-800 mb-1">焦虑心悸时</h3>
                            <p class="text-xs text-gray-400">慢呼吸练习</p>
                            <div class="mt-2 flex items-center justify-between">
                                <span class="scenario-tag bg-rose-100 text-rose-600">
                                    <i class="fas fa-bolt"></i> 焦虑
                                </span>
                                <span class="text-xs text-gray-400">3分钟</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-gray-800">情绪与专注</h2>
                </div>
                <div class="space-y-3">
                    <div class="practice-card flex">
                        <div class="w-24 h-full flex items-center justify-center" style="background: linear-gradient(135deg, #d9c7cf, #b49ca7);">
                            <i class="fas fa-pause-circle text-3xl text-white"></i>
                        </div>
                        <div class="flex-1 p-4">
                            <h3 class="font-semibold text-gray-800 mb-1">情绪暂停练习</h3>
                            <p class="text-xs text-gray-400 mb-2">情绪快爆发时，给自己一个缓冲</p>
                            <div class="flex items-center gap-2">
                                <span class="scenario-tag bg-pink-100 text-pink-600">
                                    <i class="fas fa-pause"></i> 情绪
                                </span>
                                <span class="text-xs text-gray-400">90秒</span>
                            </div>
                        </div>
                    </div>
                    <div class="practice-card flex">
                        <div class="w-24 h-full flex items-center justify-center" style="background: linear-gradient(135deg, #d9c7cf, #b49ca7);">
                            <i class="fas fa-brain text-3xl text-white"></i>
                        </div>
                        <div class="flex-1 p-4">
                            <h3 class="font-semibold text-gray-800 mb-1">脑雾专注恢复</h3>
                            <p class="text-xs text-gray-400 mb-2">注意力下降时，重新聚焦</p>
                            <div class="flex items-center gap-2">
                                <span class="scenario-tag bg-blue-100 text-blue-600">
                                    <i class="fas fa-brain"></i> 专注
                                </span>
                                <span class="text-xs text-gray-400">3分钟</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 rounded-2xl p-5">
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-info text-rose-400"></i>
                    </div>
                    <div>
                        <p class="font-medium text-gray-800 text-sm mb-1">练习小贴士</p>
                        <p class="text-xs text-gray-500 leading-relaxed">建议在安静的环境下练习，配合耳机效果更佳。如果某个练习不适合你，可以跳过尝试其他的。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item" onclick="location.href='home.html'">
            <i class="fas fa-comments"></i>
            <span>AI对话</span>
        </div>
        <div class="tab-item" onclick="location.href='learn.html'">
            <i class="fas fa-users"></i>
            <span>社区</span>
        </div>
        <div class="tab-item active" onclick="location.href='practice.html'">
            <i class="fas fa-wind"></i>
            <span>呼吸练习</span>
        </div>
        <div class="tab-item" onclick="location.href='profile.html'">
            <i class="fas fa-chart-pie"></i>
            <span>我的</span>
        </div>
    </div>
</body>
</html>
