<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习详情 - 潮安</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme-glass.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; padding: 0; overflow: hidden; }

        :root {
            --scene-accent-1: #E4B0B1;
            --scene-accent-2: #E4B0B1;
            --scene-ink: rgba(30, 23, 27, 0.9);
            --scene-ink-muted: rgba(30, 23, 27, 0.65);
        }

        .scene-photo {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url('https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }

        .scene-photo::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(10,10,12,0.28) 0%, rgba(16,16,18,0.2) 35%, rgba(14,12,16,0.42) 72%, rgba(10,10,12,0.5) 100%),
                radial-gradient(circle at 50% 18%, rgba(255,255,255,0.14), transparent 46%);
        }

        .scene-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 18%, rgba(255,255,255,0.2), transparent 48%),
                radial-gradient(circle at 82% 26%, rgba(255,255,255,0.14), transparent 52%);
            filter: blur(18px);
        }

        .ios-status-bar {
            height: 54px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            padding-top: 18px;
            position: relative;
            z-index: 20;
        }

        .content-area {
            height: calc(100vh - 54px);
            overflow-y: auto;
        }

        .glass-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breathing-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--scene-accent-1), var(--scene-accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 24px 56px rgba(44, 34, 39, 0.18);
            transform: scale(1);
            will-change: transform;
        }

        .breathing-inner {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255,255,255,0.28);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.28);
        }

        .phase-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .progress-ring { transform: rotate(-90deg); }
        .progress-ring-circle { transition: stroke-dashoffset 0.35s; }
    </style>
</head>
<body>
    <div class="scene-photo"></div>
    <div class="scene-overlay"></div>

    <div class="ios-status-bar">
        <span style="font-weight: 600; font-size: 15px; color: var(--scene-ink);">9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-sm" style="color: var(--scene-ink);"></i>
            <i class="fas fa-wifi text-sm ml-1" style="color: var(--scene-ink);"></i>
            <i class="fas fa-battery-full text-sm ml-1" style="color: var(--scene-ink);"></i>
        </div>
    </div>

    <div class="content-area">
        <div class="px-6 pt-4 pb-10 relative" style="z-index: 10;">
            <div class="flex items-center justify-between mb-10">
                <button class="glass-btn">
                    <i class="fas fa-times" style="color: var(--scene-ink);"></i>
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full" style="background: rgba(159,128,141,0.55);"></div>
                    <span class="text-sm" id="topTimer" style="color: var(--scene-ink-muted);">5:00</span>
                </div>
                <div class="w-11 h-11"></div>
            </div>

            <div class="text-center mb-12">
                <h1 class="text-2xl font-bold mb-2" style="color: var(--scene-ink);">跟随呼吸</h1>
            </div>

            <div class="flex justify-center mb-12">
                <div class="relative" style="width: 220px; height: 220px;">
                    <svg class="progress-ring" width="220" height="220">
                        <circle stroke="rgba(159,128,141,0.18)" stroke-width="4" fill="transparent" r="105" cx="110" cy="110"/>
                        <circle class="progress-ring-circle" stroke="rgba(159,128,141,0.70)" stroke-width="4" fill="transparent" r="105" cx="110" cy="110" stroke-dasharray="660" stroke-dashoffset="660" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                        <div class="breathing-circle" id="breathingCircle">
                            <div class="breathing-inner">
                                <i class="fas fa-wind text-white text-3xl mb-2" id="breathGlyph"></i>
                                <span class="text-white text-2xl font-light" id="timer">5:00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-center mb-10">
                <div class="phase-indicator">
                    <i class="fas fa-arrow-up text-xs" id="phaseIcon" style="color: rgba(30, 23, 27, 0.6);"></i>
                    <span class="text-sm" id="phaseText" style="color: var(--scene-ink-muted);">吸气 4 秒</span>
                </div>
            </div>

            <div class="flex justify-center">
                <button class="w-20 h-20 rounded-3xl flex items-center justify-center" id="playBtn" style="background: linear-gradient(135deg, var(--scene-accent-1), var(--scene-accent-2)); box-shadow: 0 16px 36px rgba(44,34,39,0.16);">
                    <i class="fas fa-pause text-white text-2xl" id="playIcon"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const INHALE_SECONDS = 4;
        const HOLD_SECONDS = 7;
        const EXHALE_SECONDS = 8;
        const SESSION_TOTAL_SECONDS = 5 * 60;

        let isPlaying = true;
        let sessionRemaining = SESSION_TOTAL_SECONDS;
        let phase = 'inhale';
        let phaseElapsed = 0;
        let lastTs = null;
        let rafId = null;
        let lastSecondTick = null;

        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const topTimer = document.getElementById('topTimer');
        const timer = document.getElementById('timer');
        const phaseText = document.getElementById('phaseText');
        const phaseIcon = document.getElementById('phaseIcon');
        const breathingCircle = document.getElementById('breathingCircle');
        const breathGlyph = document.getElementById('breathGlyph');
        const ring = document.querySelector('.progress-ring-circle');

        function fmtMMSS(sec) {
            const s = Math.max(0, Math.floor(sec));
            const mm = String(Math.floor(s / 60)).padStart(1, '0');
            const ss = String(s % 60).padStart(2, '0');
            return `${mm}:${ss}`;
        }

        function setPhase(nextPhase) {
            phase = nextPhase;
            if (phase === 'inhale') {
                phaseIcon.className = 'fas fa-arrow-up text-xs';
                breathGlyph.className = 'fas fa-wind text-white text-3xl mb-2';
            } else if (phase === 'hold') {
                phaseIcon.className = 'fas fa-pause text-xs';
                breathGlyph.className = 'fas fa-circle text-white text-3xl mb-2';
            } else {
                phaseIcon.className = 'fas fa-arrow-down text-xs';
                breathGlyph.className = 'fas fa-wind text-white text-3xl mb-2';
            }
        }

        function phaseRemainingSeconds() {
            const total = phase === 'inhale' ? INHALE_SECONDS : phase === 'hold' ? HOLD_SECONDS : EXHALE_SECONDS;
            return Math.max(0, Math.ceil(total - phaseElapsed));
        }

        function setCircleScale() {
            const minS = 0.82;
            const maxS = 1.18;
            if (phase === 'inhale') {
                const t = Math.min(1, phaseElapsed / Math.max(0.001, INHALE_SECONDS));
                breathingCircle.style.transform = `scale(${minS + (maxS - minS) * t})`;
            } else if (phase === 'hold') {
                breathingCircle.style.transform = `scale(${maxS})`;
            } else {
                const t = Math.min(1, phaseElapsed / Math.max(0.001, EXHALE_SECONDS));
                breathingCircle.style.transform = `scale(${maxS - (maxS - minS) * t})`;
            }
        }

        function updateRing() {
            if (!ring) return;
            const circumference = 660;
            const progress = 1 - (sessionRemaining / SESSION_TOTAL_SECONDS);
            ring.style.strokeDashoffset = String(circumference * (1 - Math.max(0, Math.min(1, progress))));
        }

        function updateUI() {
            const remain = phaseRemainingSeconds();
            const label = phase === 'inhale' ? '吸气' : phase === 'hold' ? '屏息' : '呼气';
            phaseText.textContent = `${label} ${remain} 秒`;
            const t = fmtMMSS(sessionRemaining);
            timer.textContent = t;
            topTimer.textContent = t;
            updateRing();
        }

        function tick(ts) {
            if (!isPlaying) return;
            if (lastTs == null) lastTs = ts;
            const dt = Math.min(0.05, (ts - lastTs) / 1000);
            lastTs = ts;

            sessionRemaining = Math.max(0, sessionRemaining - dt);
            phaseElapsed += dt;

            if (phase === 'inhale' && phaseElapsed >= INHALE_SECONDS) {
                phaseElapsed -= INHALE_SECONDS;
                setPhase('hold');
            } else if (phase === 'hold' && phaseElapsed >= HOLD_SECONDS) {
                phaseElapsed -= HOLD_SECONDS;
                setPhase('exhale');
            } else if (phase === 'exhale' && phaseElapsed >= EXHALE_SECONDS) {
                phaseElapsed -= EXHALE_SECONDS;
                setPhase('inhale');
            }

            setCircleScale();

            const secTick = Math.floor(sessionRemaining);
            if (lastSecondTick !== secTick) {
                lastSecondTick = secTick;
                updateUI();
            }

            if (sessionRemaining <= 0) {
                isPlaying = false;
                playIcon.className = 'fas fa-play text-white text-2xl';
                updateUI();
                return;
            }

            rafId = requestAnimationFrame(tick);
        }

        function resumeBreathing() {
            if (rafId) cancelAnimationFrame(rafId);
            lastTs = null;
            rafId = requestAnimationFrame(tick);
        }

        function pauseBreathing() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            lastTs = null;
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playIcon.className = 'fas fa-pause text-white text-2xl';
                resumeBreathing();
            } else {
                playIcon.className = 'fas fa-play text-white text-2xl';
                pauseBreathing();
            }
        });

        setPhase('inhale');
        setCircleScale();
        updateUI();
        resumeBreathing();
    </script>
</body>
</html>
