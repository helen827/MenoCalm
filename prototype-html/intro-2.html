<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>介绍 2 - 潮安</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme-glass.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
        .ios-status-bar { height: 54px; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; padding-top: 18px; position: relative; z-index: 20; }
        .page-bg { min-height: 100vh; background: linear-gradient(180deg, #fcf9fa 0%, #f5eef1 100%); }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #dbcdd3; }
        .dot.active { background: #9f808d; }
        .swipe-hint { font-size: 11px; color: #b09ea6; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="ios-status-bar">
        <span style="font-weight: 600; font-size: 15px; color: #3a3a3c;">9:41</span>
        <div class="flex items-center gap-1.5" style="color: #3a3a3c;">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <div class="page-bg px-8 pt-12 pb-10 flex flex-col items-center justify-between">
        <div class="w-full text-right">
            <button class="text-xs text-gray-400" onclick="location.href='welcome.html'">跳过</button>
        </div>

        <div class="text-center">
            <div class="w-28 h-28 mx-auto rounded-3xl bg-white shadow-lg border border-white/80 flex items-center justify-center mb-8">
                <i class="fas fa-chart-line text-4xl" style="color:#a78492;"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-4">每天记录，自动追踪</h1>
            <p class="text-gray-500 text-sm leading-relaxed">和 AI 对话就能记录症状、情绪和生活方式，系统会自动归纳并生成报告趋势。</p>
        </div>

        <div class="w-full">
            <div class="flex items-center justify-center gap-2 mb-5">
                <span class="dot"></span><span class="dot active"></span><span class="dot"></span>
            </div>
            <p class="swipe-hint">右滑返回，左滑继续</p>
        </div>
    </div>
    <script>
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].clientX;
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            if (deltaX < -50) location.href = 'intro-3.html';
            if (deltaX > 50) location.href = 'intro-1.html';
        }, { passive: true });
    </script>
</body>
</html>
