<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布 - 潮安社区</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme-glass.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; padding: 0; background: #fff; overflow: hidden; color: #222; }
        .ios-status-bar { height: 54px; background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; padding-top: 18px; }
        .content-area { height: calc(100vh - 54px - 86px); overflow-y: auto; background: #fff; }
        .media-row { display: flex; gap: 8px; margin-top: 8px; }
        .media-thumb { width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: #f4f4f4; }
        .media-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .media-add {
            width: 92px;
            height: 92px;
            border-radius: 10px;
            background: #f7f7f7;
            border: 1px solid #ececec;
            color: #c8c8c8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .title-input {
            margin-top: 18px;
            width: 100%;
            border: none;
            outline: none;
            font-size: 38px;
            color: #222;
            line-height: 1.3;
        }
        .title-input::placeholder { color: #d0d0d0; }
        .content-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            border-bottom: 1px solid #f1f1f1;
            padding-bottom: 12px;
        }
        .content-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 40px;
            color: #222;
            background: transparent;
        }
        .content-input::placeholder { color: #d0d0d0; }
        .quick-actions { display: flex; gap: 10px; margin-top: 16px; }
        .quick-pill {
            height: 36px;
            padding: 0 14px;
            border-radius: 18px;
            background: #f7f7f7;
            color: #333;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .quick-pill i { font-size: 13px; color: #666; }
        .divider { height: 1px; background: #f1f1f1; margin: 14px 0 0; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; height: 52px; border-bottom: 1px solid #f4f4f4; font-size: 15px; color: #333; }
        .setting-row:last-child { border-bottom: none; }
        .setting-row .left { display: flex; align-items: center; gap: 10px; }
        .setting-row .right { color: #a2a2a2; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .location-tags {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0 14px;
            border-bottom: 1px solid #f4f4f4;
        }
        .location-tags span {
            background: #f3f3f3;
            color: #8a8a8a;
            border-radius: 14px;
            padding: 6px 10px;
            font-size: 12px;
        }
        .bottom-actions {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 86px;
            background: #fff;
            border-top: 1px solid #f1f1f1;
            display: grid;
            grid-template-columns: 1fr 1.8fr;
            gap: 12px;
            padding: 14px 16px 18px;
        }
        .btn-draft {
            border: 1px solid #ececec;
            border-radius: 24px;
            background: #fff;
            color: #444;
            font-size: 15px;
            font-weight: 500;
        }
        .btn-post {
            border: none;
            border-radius: 24px;
            background: #ff2442;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="ios-status-bar">
        <span style="font-weight: 600; font-size: 15px;">16:33</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm ml-1"></i>
            <i class="fas fa-battery-three-quarters text-sm ml-1"></i>
        </div>
    </div>

    <div class="content-area">
        <div class="px-4">
            <div class="h-10 flex items-center">
                <button class="text-gray-400 text-2xl" onclick="location.href='learn.html'">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <div class="media-row">
                <div class="media-thumb">
                    <img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?w=320&h=320&fit=crop" alt="img1">
                </div>
                <button class="media-add" aria-label="add-image">+</button>
            </div>

            <input class="title-input" placeholder="添加标题">

            <div class="content-input-wrap">
                <input class="content-input" placeholder="添加正文或发送语音消息。">
                <i class="fas fa-microphone text-gray-300 text-xl"></i>
            </div>

            <div class="quick-actions">
                <span class="quick-pill"><i class="fas fa-hashtag"></i> 话题</span>
                <span class="quick-pill"><i class="fas fa-at"></i> 提及用户</span>
                <span class="quick-pill"><i class="fas fa-chart-simple"></i> 投票</span>
            </div>

            <div class="divider"></div>

            <div>
                <div class="setting-row">
                    <div class="left">
                        <i class="fas fa-location-dot text-gray-500"></i>
                        <span>添加位置</span>
                    </div>
                    <div class="right">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </div>
                </div>
                <div class="location-tags">
                    <span>黄金城道步行街</span>
                    <span>古北1699商业广场</span>
                    <span>上海高岛屋百货</span>
                    <span>上海中心</span>
                </div>

                <div class="setting-row">
                    <div class="left">
                        <i class="fas fa-lock text-gray-500"></i>
                        <span>公开可见</span>
                    </div>
                    <div class="right">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="left">
                        <i class="fas fa-puzzle-piece text-gray-500"></i>
                        <span>添加组件</span>
                    </div>
                    <div class="right">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="left">
                        <i class="fas fa-gear text-gray-500"></i>
                        <span>高级设置</span>
                    </div>
                    <div class="right">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-actions">
        <button class="btn-draft">保存草稿</button>
        <button class="btn-post" onclick="location.href='learn.html'">发布</button>
    </div>
</body>
</html>
