<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme-glass.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; padding: 0; background: radial-gradient(circle at 20% 12%, #fffaff 0%, #f8f5f8 34%, #f2ecef 100%); overflow: hidden; position: relative; }
        body::before { content: ''; position: absolute; width: 320px; height: 320px; right: -160px; top: -40px; background: radial-gradient(circle, rgba(231,203,216,0.56), rgba(231,203,216,0)); filter: blur(54px); pointer-events: none; z-index: 0; }
        body::after { content: ''; position: absolute; width: 300px; height: 300px; left: -140px; bottom: 10px; background: radial-gradient(circle, rgba(176,216,255,0.64), rgba(176,216,255,0)); filter: blur(48px); pointer-events: none; z-index: 0; }
        .ios-status-bar { height: 54px; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; padding-top: 18px; position: relative; z-index: 12; }
        .content-area { height: calc(100vh - 54px - 76px); overflow-y: auto; padding-bottom: 20px; position: relative; z-index: 2; }
        .status-card { background: rgba(255,255,255,0.40); border: 1px solid rgba(255,255,255,0.88); border-radius: 30px; padding: 24px; color: #4f4348; backdrop-filter: blur(42px) saturate(165%); -webkit-backdrop-filter: blur(42px) saturate(165%); box-shadow: inset 0 2px 18px rgba(255,255,255,0.54), 0 14px 30px rgba(138,114,125,0.11); }
        .menu-item { display: flex; align-items: center; padding: 16px; background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.88); border-radius: 22px; cursor: pointer; transition: background 0.2s; backdrop-filter: blur(36px); -webkit-backdrop-filter: blur(36px); box-shadow: inset 0 2px 14px rgba(255,255,255,0.50), 0 10px 24px rgba(138,114,125,0.10); }
        .menu-item:hover { background: rgba(255,255,255,0.52); }
        .menu-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-right: 14px; }
        .badge { width: 8px; height: 8px; border-radius: 50%; background: #E4B0B1; }
        .quote-card { background: rgba(255,255,255,0.40); border-radius: 30px; padding: 20px; border: 1px solid rgba(255,255,255,0.88); box-shadow: inset 0 2px 16px rgba(255,255,255,0.50), 0 12px 26px rgba(138,114,125,0.10); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
        .stats-card { background: rgba(255,255,255,0.40); border-radius: 30px; padding: 16px; border: 1px solid rgba(255,255,255,0.88); box-shadow: inset 0 2px 16px rgba(255,255,255,0.50), 0 12px 26px rgba(138,114,125,0.10); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
        .progress-track { height: 8px; background: #efe7ea; border-radius: 999px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(135deg, #E4B0B1, #E4B0B1); width: 60%; }
        .symptom-chip { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.56); color: #755f6b; font-size: 12px; border: 1px solid rgba(255,255,255,0.9); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
        .calendar-cell { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #7a6a70; background: #f6eef1; border: 1px solid rgba(118,93,103,0.12); }
        .calendar-cell.active { background: linear-gradient(135deg, #E4B0B1, #E4B0B1); color: white; border: none; }
        .calendar-cell.today { outline: 2px solid rgba(159,128,141,0.45); background: #fff; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 10px; }
        .calendar-week { font-size: 10px; color: #8b7c83; text-align: center; }
    </style>
</head>
