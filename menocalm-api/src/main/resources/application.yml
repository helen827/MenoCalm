spring:
  application:
    name: menocalm-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-seconds: ${JWT_ACCESS_SECONDS:1800}
  refresh-token:
    ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:2592000}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    community-admin-user-ids: ${COMMUNITY_ADMIN_USER_IDS:}
  community:
    seed-on-empty: ${COMMUNITY_SEED_ON_EMPTY:false}
    seed-classpath: classpath:data/community-feed.seed.json
  auth:
    legacy-phone-login-enabled: ${LEGACY_PHONE_LOGIN_ENABLED:false}
    test-account-login-enabled: ${TEST_ACCOUNT_LOGIN_ENABLED:false}
    test-account-secret: ${TEST_ACCOUNT_SECRET:}
    login-rate-limit:
      per-phone-max: ${LOGIN_RATE_LIMIT_PER_PHONE_MAX:8}
      per-ip-max: ${LOGIN_RATE_LIMIT_PER_IP_MAX:20}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
    sms:
      provider: ${SMS_PROVIDER:aliyun}
      sign-name: ${SMS_SIGN_NAME:}
      template-code: ${SMS_TEMPLATE_CODE:}
      access-key-id: ${SMS_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
      region-id: ${SMS_REGION_ID:cn-hangzhou}
      verification:
        code-ttl-seconds: ${SMS_CODE_TTL_SECONDS:300}
        resend-cooldown-seconds: ${SMS_RESEND_COOLDOWN_SECONDS:60}
        per-phone-per-hour-max: ${SMS_PER_PHONE_PER_HOUR_MAX:6}
        per-ip-per-hour-max: ${SMS_PER_IP_PER_HOUR_MAX:20}
        max-verify-attempts: ${SMS_MAX_VERIFY_ATTEMPTS:8}
    wechat:
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      universal-link: ${WECHAT_UNIVERSAL_LINK:}
      redirect-uri: ${WECHAT_REDIRECT_URI:}
  conversations:
    # Calendar day boundary for "today's full chat" context (Component A / analyze transcript)
    daily-context-zone-id: ${CONVERSATIONS_DAILY_CONTEXT_ZONE_ID:Asia/Shanghai}
  ai:
    provider: ${AI_PROVIDER:}
    endpoint: ${AI_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    model-fallbacks: ${AI_MODEL_FALLBACKS:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:15000}
    chat-temperature: ${AI_CHAT_TEMPERATURE:0.55}
    extraction-temperature: ${AI_EXTRACTION_TEMPERATURE:0.3}
    report-temperature: ${AI_REPORT_TEMPERATURE:0.7}
  storage:
    s3-endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    s3-bucket: ${S3_BUCKET:replace-with-real-bucket}
    s3-access-key: ${S3_ACCESS_KEY:replace-with-real-access-key}
    s3-secret-key: ${S3_SECRET_KEY:replace-with-real-secret-key}
    s3-region: ${S3_REGION:us-east-1}
    presign-ttl-seconds: ${S3_PRESIGN_TTL_SECONDS:600}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
  persistence:
    mysql:
      url: ${MYSQL_URL:}
      user: ${MYSQL_USER:}
      password: ${MYSQL_PASSWORD:}
